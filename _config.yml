title: Preghiere
description: Raccolta personale di preghiere cattoliche.
url: "https://preghiamo.eu"
baseurl: ""
lang: it

markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: true

# ── Collezione preghiere ─────────────────────────────────────────────
# Ogni file .md in _preghiere/ diventa una pagina del sito.
# Per aggiungere una preghiera: crea _preghiere/categoria/nome.md
# con il front matter: title, category, order (opzionale)
collections:
  preghiere:
    output: true
    permalink: /preghiere/:path/

defaults:
  - scope:
      path: "_preghiere"
      type: "preghiere"
    values:
      layout: preghiera

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - backup_preghiere.txt
  - vendor
  - .sass-cache
  - .jekyll-cache
