<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Spada dello Spirito</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        background: linear-gradient(145deg,#BDD0EE 0%,#CCBFED 28%,#E8BFDA 62%,#F5CEBC 100%);
        color: #1C1A2E;
      }
      .cross { font-size: 3rem; margin-bottom: 1.5rem; }
      h1 { font-size: clamp(1.4rem,4vw,2rem); font-weight: 800; margin-bottom: .75rem; }
      p { color: #6B6888; max-width: 34ch; line-height: 1.7; margin-bottom: 2rem; }
      a {
        display: inline-block;
        background: #7B6CF6;
        color: #fff;
        text-decoration: none;
        padding: .6rem 1.6rem;
        border-radius: 999px;
        font-weight: 700;
        font-size: .9rem;
      }
    </style>
  </head>
  <body>
    <div class="cross">✝</div>
    <h1>Sei offline</h1>
    <p>Non è stato possibile caricare questa pagina. Controlla la tua connessione e riprova.</p>
    <a href="/">Torna alla home</a>
  </body>
</html>
