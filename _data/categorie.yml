# ── Come aggiungere una nuova categoria ─────────────────────────────
# 1. Aggiungi qui la definizione (id, titolo, tipo, order)
# 2. Crea il file categorie/<id>.md   (solo 2 righe di front matter)
# 3. Crea le preghiere in _preghiere/<id>/nome.md  con  category: <id>
#
# Tipi:
#   singola  →  una sola pagina, link diretto dalla home
#   lista    →  categoria con più preghiere, ha la propria pagina elenco
#
# gruppo: santi  →  i file stanno in _preghiere/santi/<id>/  (URL: /preghiere/santi/<id>/)
#                   omettere per le voci non-santi                  (URL: /preghiere/<id>/)
#
# parent: <id>  →  sotto-categoria: non appare in home ma nella pagina del parent
# ─────────────────────────────────────────────────────────────────────

