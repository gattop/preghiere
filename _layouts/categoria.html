---
layout: default
---
{% if page.parent_url %}
<p><a href="{{ page.parent_url }}">&#8592; Indietro</a></p>
{% endif %}

<h1>{{ page.title }}</h1>

{% if page.sottotitolo %}
<p class="descrizione">{{ page.sottotitolo }}</p>
{% endif %}

{{ content }}

{% for voce in page.voci %}
<div class="divConSeparatori">
  <p class="elenco"><a href="{{ voce.url }}">{{ voce.label }}</a></p>
</div>
{% endfor %}

{% if page.parent_url %}
<p><a href="{{ page.parent_url }}">&#8592;</a></p>
{% endif %}
